services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/product_filter
      SPRING_DATASOURCE_USERNAME: jacksam
      SPRING_DATASOURCE_PASSWORD: jacksam_secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: product_filter
      POSTGRES_USER: jacksam
      POSTGRES_PASSWORD: jacksam_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jacksam -d product_filter"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
