server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product_filter
    username: jacksam
    password: jacksam_secret
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'

app:
  jwt:
    secret: jacksam-product-filter-jwt-secret-key-must-be-at-least-256-bits-long
    expiration-ms: 86400000

  cache:
    user-products-ttl: 300
    product-ttl: 600
